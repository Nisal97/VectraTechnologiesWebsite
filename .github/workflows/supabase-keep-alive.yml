name: Keep Supabase Alive

on:
  schedule:
    # Runs once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret is missing."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$CLEAN_URL/rest/v1/contact_submissions?select=id&limit=1")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Supabase responded with HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Response body: $BODY"
            echo "Ping failed! Expected HTTP 200."
            exit 1
          fi