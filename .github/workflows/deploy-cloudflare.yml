name: Test & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: 1. Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-playwright:
    name: 2a. E2E Tests (Playwright)
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-selenium:
    name: 2b. E2E Tests (Java Selenium)
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          cache-dependency-path: "e2e-selenium/pom.xml"

      - name: Install Node dependencies
        run: npm ci

      - name: Start Next.js server & run Selenium tests
        run: |
          npm run dev &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 2
          done
          mvn -f e2e-selenium/pom.xml test -B -Dheadless=true
          TEST_EXIT=$?
          kill $SERVER_PID || true
          exit $TEST_EXIT

  deploy:
    name: 3. Build & Deploy to Cloudflare Pages
    needs: [test, e2e-playwright, e2e-selenium]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=vectra-solutions-web --branch=main